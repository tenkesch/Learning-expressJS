<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteFlow</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6fb;
            --surface: rgba(255, 255, 255, 0.86);
            --surface-strong: #ffffff;
            --surface-soft: rgba(247, 249, 253, 0.9);
            --border: rgba(23, 35, 61, 0.08);
            --border-strong: rgba(23, 35, 61, 0.14);
            --text: #14213d;
            --muted: #64748b;
            --accent: #2563eb;
            --accent-strong: #1d4ed8;
            --accent-shadow: 0 14px 30px rgba(37, 99, 235, 0.12);
            --accent-soft: rgba(37, 99, 235, 0.12);
            --inset-highlight: rgba(255,255,255,0.06);
            --danger: #dc2626;
            --danger-soft: rgba(220, 38, 38, 0.12);
            --shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
            --shadow-soft: 0 12px 24px rgba(15, 23, 42, 0.06);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 14px;
            --sidebar-width: 25vw;
            --sidebar-min: 300px;
            --sidebar-max: 390px;
            --content-max: 1100px;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.10), transparent 26%),
                radial-gradient(circle at 90% 12%, rgba(14, 165, 233, 0.09), transparent 20%),
                linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(15, 23, 42, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(15, 23, 42, 0.025) 1px, transparent 1px);
            background-size: 52px 52px;
            opacity: 0.9;
            mask-image: radial-gradient(circle at center, black, transparent 78%);
        }

        body.dark::before {
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .app-shell {
            position: relative;
            z-index: 1;
            width: min(100%, 1600px);
            margin: 0 auto;
            min-height: 100vh;
            display: grid;
            grid-template-columns: clamp(var(--sidebar-min), var(--sidebar-width), var(--sidebar-max)) minmax(0, 1fr);
            gap: 18px;
            padding: 18px;
        }

        .sidebar,
        .editor {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 36px);
            overflow: hidden;
        }

        .sidebar-top {
            padding: 18px 18px 14px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, var(--surface-strong), var(--surface));
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .brand-copy h1,
        .brand-copy p,
        .section-title,
        .note-card h3,
        .note-card p,
        .top-title,
        .empty-state p {
            margin: 0;
        }

        .brand-copy h1 {
            font-size: 1.05rem;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .brand-copy p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .menu-toggle,
        .sidebar-close,
        .create-btn,
        .note-action-btn,
        .icon-btn,
        .action-btn {
            border: 0;
            cursor: pointer;
            font: inherit;
        }

        .menu-toggle,
        .sidebar-close,
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: var(--surface-strong);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
        }

        .create-btn {
            width: 100%;
            min-height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: white;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--accent-shadow);
        }

        .search-wrap {
            margin-bottom: 14px;
        }

        .search-input,
        .title-input,
        .content-input {
            width: 100%;
            border: 1px solid var(--border);
            background: var(--surface-strong);
            color: var(--text);
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .search-input:focus,
        .title-input:focus,
        .content-input:focus {
            border-color: rgba(37, 99, 235, 0.36);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
        }

        .search-input {
            height: 46px;
            border-radius: 14px;
            padding: 0 14px;
        }

        .sidebar-list {
            padding: 10px 10px 12px;
            overflow: auto;
            display: grid;
            gap: 8px;
            align-content: start;
            grid-auto-rows: min-content;
            flex: 1;
        }

        .sidebar-list::-webkit-scrollbar,
        .content-input::-webkit-scrollbar {
            width: 10px;
        }

        .sidebar-list::-webkit-scrollbar-thumb,
        .content-input::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.25);
            border-radius: 999px;
            border: 3px solid transparent;
            background-clip: padding-box;
        }

        .sidebar-note {
            position: relative;
            border: 1px solid transparent;
            background: transparent;
            padding: 0;
            --note-bg: var(--surface-strong);
            --note-bg-hover: var(--surface-soft);
            --note-border: var(--border);
            --note-shadow: 0 8px 18px rgba(15, 23, 42, 0.03);
            --note-text: var(--text);
            --note-muted: var(--muted);
        }

        .note-select-btn {
            width: 100%;
            border-radius: 16px;
            padding: 13px 44px 13px 14px;
            background: var(--note-bg);
            border: 1px solid var(--note-border);
            box-shadow: var(--note-shadow);
            text-align: left;
            display: block;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .sidebar-note:hover .note-select-btn,
        .sidebar-note:focus-within .note-select-btn,
        .sidebar-note.active .note-select-btn {
            transform: translateY(-1px);
            border-color: color-mix(in srgb, var(--note-border) 80%, var(--text) 20%);
            background: var(--note-bg-hover);
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.07);
        }

        .note-copy {
            min-width: 0;
            flex: 1;
        }

        .note-copy h3 {
            font-size: 0.98rem;
            line-height: 1.3;
            letter-spacing: -0.02em;
            color: var(--note-text);
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-copy p {
            color: var(--note-muted);
            font-size: 0.87rem;
            line-height: 1.45;
            line-clamp: 2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 3;
            display: grid;
            justify-items: end;
            gap: 8px;
        }

        .menu-toggle {
            opacity: 0;
            transform: translateY(2px);
            pointer-events: none;
            transition: opacity 0.16s ease, transform 0.16s ease, background 0.16s ease;
        }

        .sidebar-note:hover .menu-toggle,
        .sidebar-note:focus-within .menu-toggle,
        .sidebar-note.active .menu-toggle {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .note-actions-menu {
            position: absolute;
            right: 0;
            top: 48px;
            z-index: 4;
            min-width: 170px;
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 6px;
            display: none;
        }

        .note-actions-menu.open {
            display: grid;
            gap: 4px;
        }

        .note-action-btn {
            width: 100%;
            min-height: 40px;
            border-radius: 12px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            background: transparent;
            color: var(--text);
            text-align: left;
        }

        .note-action-btn:hover {
            background: var(--surface-soft);
        }

        .note-action-btn.danger {
            color: var(--danger);
        }

        .note-action-btn.danger:hover {
            background: var(--danger-soft);
        }

        .note-badges {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            color: var(--note-muted);
            font-size: 0.75rem;
        }

        .label-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .label-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
            border: 1px solid var(--label-border, rgba(37, 99, 235, 0.18));
            background: var(--label-bg, rgba(37, 99, 235, 0.12));
            color: var(--label-fg, #1d4ed8);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }

        .editor {
            min-height: calc(100vh - 36px);
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            overflow: hidden;
            background: var(--surface);
        }

        .editor-top {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, var(--surface-strong), var(--surface));
            display: grid;
            gap: 12px;
        }

        .editor-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .mobile-only {
            display: none;
        }

        .center-title-wrap {
            display: grid;
            place-items: center;
            gap: 6px;
            text-align: center;
            width: 100%;
        }

        .center-kicker {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .title-input {
            max-width: min(620px, 100%);
            text-align: center;
            border-radius: 16px;
            min-height: 50px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            padding: 0 16px;
        }

        .labels-input {
            max-width: min(620px, 100%);
            min-height: 42px;
            border-radius: 14px;
            padding: 0 14px;
            text-align: center;
            font-size: 0.92rem;
        }

        .editor-meta {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 0.87rem;
        }

        .content-wrap {
            padding: 18px 20px 0;
            overflow: hidden;
            display: grid;
        }

        .content-input {
            width: 100%;
            min-height: 100%;
            resize: none;
            border-radius: 22px;
            padding: 20px 20px 24px;
            line-height: 1.75;
            font-size: 1rem;
            background: var(--surface-strong);
            box-shadow: inset 0 1px 0 var(--inset-highlight);
            color: var(--text);
        }

        .editor-footer {
            padding: 14px 20px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .action-btn {
            min-height: 42px;
            border-radius: 999px;
            padding: 0 15px;
            background: var(--surface-strong);
            border: 1px solid var(--border);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-soft);
        }

        .action-btn.danger {
            color: var(--danger);
            background: var(--danger-soft);
            border-color: rgba(220, 38, 38, 0.16);
        }

        .empty-state {
            display: grid;
            place-items: center;
            min-height: 220px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--border-strong);
            border-radius: 20px;
            background: var(--surface-soft);
            padding: 24px;
            margin: 8px 10px 12px;
        }

        .empty-state h2 {
            margin: 0 0 6px;
            color: var(--text);
            font-size: 1.05rem;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.32);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 9;
        }

        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 999px;
            background: var(--surface-strong);
            border: 1px solid var(--border);
            color: var(--muted);
            box-shadow: var(--shadow-soft);
            font-size: 0.84rem;
        }

        .title-split {
            width: 100%;
            display: grid;
            place-items: center;
        }

        @media (max-width: 1100px) {
            .app-shell {
                grid-template-columns: 310px minmax(0, 1fr);
            }
        }

        @media (max-width: 920px) {
            .app-shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                left: 12px;
                top: 12px;
                bottom: 12px;
                width: min(88vw, 380px);
                z-index: 10;
                transform: translateX(-110%);
                transition: transform 0.22s ease;
                min-height: auto;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-only {
                display: inline-flex;
            }

            .editor {
                min-height: calc(100vh - 36px);
            }
        }

        @media (max-width: 640px) {
            .app-shell {
                padding: 10px;
                gap: 12px;
            }

            .editor-top,
            .content-wrap,
            .editor-footer {
                padding-left: 14px;
                padding-right: 14px;
            }

            .title-input {
                font-size: 1.08rem;
            }

            .content-input {
                padding: 16px;
            }
        }
        /* Dark theme overrides */
        body.dark {
            --bg: #071021;
            --surface: rgba(10, 14, 22, 0.80);
            --surface-strong: rgba(10, 14, 22, 0.95);
            --surface-soft: rgba(12, 18, 28, 0.6);
            --border: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.08);
            --text: #e6eef8;
            --muted: #94a3b8;
            --accent: #60a5fa;
            --accent-soft: rgba(96, 165, 250, 0.12);
            --danger: #fb7185;
            --danger-soft: rgba(251, 113, 133, 0.12);
            --inset-highlight: rgba(255,255,255,0.03);
            --shadow: 0 22px 60px rgba(2,6,23,0.32);
            --shadow-soft: 0 12px 24px rgba(2,6,23,0.18);
            --accent-shadow: 0 14px 30px rgba(96, 165, 250, 0.08);
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.08), transparent 26%),
                radial-gradient(circle at 90% 12%, rgba(14, 165, 233, 0.04), transparent 20%),
                linear-gradient(180deg, #0a0e16 0%, #0f1420 100%);
        }
    </style>
</head>
<body>
    <div id="overlay" class="overlay" aria-hidden="true"></div>

    <main class="app-shell">
        <aside id="sidebar" class="sidebar" aria-label="Notes sidebar">
            <div class="sidebar-top">
                <div class="brand-row">
                    <div class="brand-copy">
                        <h1>NoteFlow</h1>
                        <p>Clean, local, and fast notes.</p>
                    </div>
                    <button id="closeSidebarBtn" class="sidebar-close mobile-only" type="button" aria-label="Close sidebar">✕</button>
                </div>

                <div class="search-wrap">
                    <input id="searchInput" class="search-input" type="search" placeholder="Search notes" aria-label="Search notes">
                </div>

                <button id="newNoteBtn" class="create-btn" type="button">+ Create Note</button>
            </div>

            <div id="noteList" class="sidebar-list" aria-label="All notes"></div>
        </aside>

        <section class="editor" aria-label="Note editor">
            <div class="editor-top">
                    <div class="editor-top-row">
                    <button id="openSidebarBtn" class="icon-btn mobile-only" type="button" aria-label="Open sidebar">☰</button>
                    <div class="center-title-wrap">
                        <div class="center-kicker">Currently editing</div>
                        <input id="titleInput" class="title-input" type="text" placeholder="Untitled note" aria-label="Current note title">
                        <input id="labelsInput" class="labels-input" type="text" placeholder="Labels, separated by commas" aria-label="Note labels">
                        <div class="editor-meta">
                            <span id="savedMeta">No note selected</span>
                        </div>
                    </div>
                    <button id="themeToggleBtn" class="icon-btn" type="button" aria-label="Toggle theme">🌙</button>
                    <button id="duplicateBtn" class="icon-btn mobile-only" type="button" aria-label="Duplicate note">⎘</button>
                </div>
            </div>

            <div class="content-wrap">
                <textarea id="contentInput" class="content-input" placeholder="Start typing your note here..." aria-label="Note content"></textarea>
            </div>

            <div class="editor-footer">
                <div id="wordCount">0 words</div>
                <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
                    <button id="desktopDuplicateBtn" class="action-btn" type="button">Duplicate</button>
                    <button id="deleteBtn" class="action-btn danger" type="button">Delete note</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const STORAGE_KEY = 'noteflow.notes.v2';
        const SELECTED_KEY = 'noteflow.selected.v2';
        const THEME_KEY = 'noteflow.theme';

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const noteList = document.getElementById('noteList');
        const searchInput = document.getElementById('searchInput');
        const newNoteBtn = document.getElementById('newNoteBtn');
        const titleInput = document.getElementById('titleInput');
        const labelsInput = document.getElementById('labelsInput');
        const contentInput = document.getElementById('contentInput');
        const savedMeta = document.getElementById('savedMeta');
        const wordCount = document.getElementById('wordCount');
        const deleteBtn = document.getElementById('deleteBtn');
        const duplicateBtn = document.getElementById('duplicateBtn');
        const desktopDuplicateBtn = document.getElementById('desktopDuplicateBtn');
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        const isMobile = () => window.matchMedia('(max-width: 920px)').matches;
        const createId = () => (window.crypto?.randomUUID ? crypto.randomUUID() : `note-${Date.now()}-${Math.random().toString(16).slice(2)}`);
        const escapeHtml = (value) => value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
        const wordCountFor = (text) => {
            const trimmed = text.trim();
            return trimmed ? trimmed.split(/\s+/).length : 0;
        };
        const hashString = (value) => {
            let hash = 0;
            for (let index = 0; index < value.length; index += 1) {
                hash = (hash * 31 + value.charCodeAt(index)) >>> 0;
            }

            return hash;
        };
        const parseLabels = (value) => [...new Set(value.split(',').map((item) => item.trim()).filter(Boolean))];
        const formatLabels = (labels) => labels.join(', ');
        const labelTheme = (label) => {
            const hue = hashString(label.toLowerCase()) % 360;
            const dark = typeof document !== 'undefined' && document.body && document.body.classList.contains('dark');

            if (dark) {
                return {
                    bg: `hsl(${hue} 48% 32%)`,
                    bgHover: `hsl(${hue} 48% 36%)`,
                    border: `hsl(${hue} 48% 42%)`,
                    text: `hsl(${hue} 60% 94%)`,
                    muted: `hsl(${hue} 28% 70%)`,
                    chipBg: `hsl(${hue} 48% 38%)`,
                    chipText: `hsl(${hue} 64% 94%)`,
                    chipBorder: `hsl(${hue} 48% 44%)`
                };
            }

            return {
                bg: `hsl(${hue} 82% 94%)`,
                bgHover: `hsl(${hue} 82% 91%)`,
                border: `hsl(${hue} 58% 82%)`,
                text: `hsl(${hue} 52% 24%)`,
                muted: `hsl(${hue} 28% 36%)`,
                chipBg: `hsl(${hue} 80% 90%)`,
                chipText: `hsl(${hue} 62% 34%)`,
                chipBorder: `hsl(${hue} 56% 78%)`
            };
        };
        const formatTime = (value) => {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
                return '—';
            }

            return date.toLocaleString([], {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        };

        const loadNotes = () => {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const notes = raw ? JSON.parse(raw) : [];
                return Array.isArray(notes) ? notes.map((note) => ({ pinned: false, labels: [], ...note, labels: Array.isArray(note.labels) ? note.labels : [] })) : [];
            } catch {
                return [];
            }
        };

        const saveNotes = (notes) => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        };

        let notes = loadNotes();
        let selectedId = localStorage.getItem(SELECTED_KEY) || '';
        let searchTerm = '';
        let openMenuId = '';
        let forceEditorSync = false;

        if (!notes.length) {
            const now = new Date().toISOString();
            notes = [{
                id: createId(),
                title: 'Welcome to NoteFlow',
                content: 'Create notes, pin important ones to the top, and keep everything local in your browser.',
                createdAt: now,
                updatedAt: now,
                pinned: false
            }];
            selectedId = notes[0].id;
            saveNotes(notes);
            localStorage.setItem(SELECTED_KEY, selectedId);
        }

        const getSelectedNote = () => notes.find((note) => note.id === selectedId) || null;

        const persistSelection = (id) => {
            selectedId = id;
            localStorage.setItem(SELECTED_KEY, id);
        };

        const updateNote = (nextNote) => {
            const index = notes.findIndex((note) => note.id === nextNote.id);
            if (index >= 0) {
                notes[index] = nextNote;
            } else {
                notes.unshift(nextNote);
            }

            saveNotes(notes);
            persistSelection(nextNote.id);
        };

        const sortedNotes = () => {
            const filtered = notes.filter((note) => {
                if (!searchTerm) {
                    return true;
                }

                const haystack = `${note.title}\n${note.content}\n${(note.labels || []).join(' ')}`.toLowerCase();
                return haystack.includes(searchTerm.toLowerCase());
            });

            return [...filtered].sort((left, right) => {
                if (left.pinned !== right.pinned) {
                    return left.pinned ? -1 : 1;
                }

                return new Date(right.updatedAt) - new Date(left.updatedAt);
            });
        };

        const closeMenu = () => {
            openMenuId = '';
            render();
        };

        const openSidebar = () => {
            sidebar.classList.add('open');
            overlay.classList.add('open');
        };

        const closeSidebar = () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        };

        const syncEditor = (note) => {
            if (!note) {
                titleInput.value = '';
                labelsInput.value = '';
                contentInput.value = '';
                savedMeta.textContent = 'No note selected';
                wordCount.textContent = '0 words';
                forceEditorSync = false;
                return;
            }

            if (forceEditorSync || document.activeElement !== titleInput) {
                titleInput.value = note.title;
            }

            if (forceEditorSync || document.activeElement !== labelsInput) {
                labelsInput.value = formatLabels(note.labels || []);
            }

            if (forceEditorSync || document.activeElement !== contentInput) {
                contentInput.value = note.content;
            }

            savedMeta.textContent = `Updated ${formatTime(note.updatedAt)}${note.pinned ? ' • Pinned' : ''}`;
            wordCount.textContent = `${wordCountFor(note.content)} words`;
            forceEditorSync = false;
        };

        const render = () => {
            const visibleNotes = sortedNotes();
            const current = getSelectedNote();

            syncEditor(current);

            if (!visibleNotes.length) {
                noteList.innerHTML = '<div class="empty-state"><div><h2>No notes found</h2><p>Try a different search or create a new note.</p></div></div>';
                return;
            }

            noteList.innerHTML = visibleNotes.map((note) => {
                const active = note.id === selectedId ? 'active' : '';
                const menuOpen = note.id === openMenuId ? 'open' : '';
                const preview = note.content.trim() ? note.content.trim().slice(0, 110) : 'Start writing to add content here.';
                const labels = (note.labels || []).slice(0, 3);
                const primaryLabel = note.labels?.[0] || '';
                const theme = primaryLabel ? labelTheme(primaryLabel) : null;
                const cardStyle = theme
                    ? `--note-bg: ${theme.bg}; --note-bg-hover: ${theme.bgHover}; --note-border: ${theme.border}; --note-text: ${theme.text}; --note-muted: ${theme.muted}; --note-shadow: 0 8px 18px rgba(15, 23, 42, 0.03);`
                    : '';

                return `
                    <div class="sidebar-note ${active}" data-note-id="${note.id}" style="${cardStyle}">
                        <button class="note-select-btn" type="button" data-select-note="${note.id}">
                            <div class="note-copy">
                                <h3>${escapeHtml(note.title || 'Untitled note')}</h3>
                                <p>${escapeHtml(preview)}${note.content.trim().length > 110 ? '...' : ''}</p>
                                ${labels.length ? `
                                <div class="label-row">
                                    ${labels.map((label) => {
                                        const chipTheme = labelTheme(label);
                                        return `<span class="label-chip" style="--label-bg: ${chipTheme.chipBg}; --label-fg: ${chipTheme.chipText}; --label-border: ${chipTheme.chipBorder};">${escapeHtml(label)}</span>`;
                                    }).join('')}
                                </div>
                                ` : ''}
                                <div class="note-badges">
                                    ${note.pinned ? '<span class="pill">Pinned</span>' : ''}
                                    <span>${wordCountFor(note.content)} words</span>
                                    <span>${formatTime(note.updatedAt)}</span>
                                </div>
                            </div>
                        </button>
                        <div class="note-actions">
                            <button class="menu-toggle" type="button" aria-label="Open note actions" data-toggle-menu="${note.id}">⋯</button>
                            <div class="note-actions-menu ${menuOpen}" data-menu-for="${note.id}">
                                <button class="note-action-btn" type="button" data-pin-note="${note.id}">${note.pinned ? 'Unpin from top' : 'Pin to top'}</button>
                                <button class="note-action-btn danger" type="button" data-delete-note="${note.id}">Delete this Note</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        const createNote = () => {
            const now = new Date().toISOString();
            const note = {
                id: createId(),
                title: 'Untitled note',
                labels: [],
                content: '',
                createdAt: now,
                updatedAt: now,
                pinned: false
            };

            notes.unshift(note);
            saveNotes(notes);
            persistSelection(note.id);
            forceEditorSync = true;
            openMenuId = '';
            render();
            titleInput.focus();
            titleInput.select();

            if (isMobile()) {
                closeSidebar();
            }
        };

        const selectNote = (noteId) => {
            const note = notes.find((item) => item.id === noteId);
            if (!note) {
                return;
            }

            persistSelection(noteId);
            forceEditorSync = true;
            openMenuId = '';
            render();

            if (isMobile()) {
                closeSidebar();
            }
        };

        const saveCurrentNote = () => {
            const current = getSelectedNote();
            if (!current) {
                return;
            }

            const updated = {
                ...current,
                title: titleInput.value.trim() || 'Untitled note',
                labels: parseLabels(labelsInput.value),
                content: contentInput.value,
                updatedAt: new Date().toISOString()
            };

            updateNote(updated);
            render();
        };

        const duplicateCurrentNote = () => {
            const current = getSelectedNote();
            if (!current) {
                return;
            }

            const now = new Date().toISOString();
            const copy = {
                id: createId(),
                title: `${current.title || 'Untitled note'} Copy`,
                content: current.content,
                labels: [...(current.labels || [])],
                createdAt: now,
                updatedAt: now,
                pinned: false
            };

            notes.unshift(copy);
            saveNotes(notes);
            persistSelection(copy.id);
            render();
            titleInput.focus();
            titleInput.select();

            if (isMobile()) {
                closeSidebar();
            }
        };

        const deleteNote = (noteId) => {
            const note = notes.find((item) => item.id === noteId);
            if (!note) {
                return;
            }

            if (!window.confirm(`Delete "${note.title || 'Untitled note'}"?`)) {
                return;
            }

            notes = notes.filter((item) => item.id !== noteId);

            if (!notes.length) {
                const now = new Date().toISOString();
                const fallback = {
                    id: createId(),
                    title: 'Untitled note',
                    labels: [],
                    content: '',
                    createdAt: now,
                    updatedAt: now,
                    pinned: false
                };

                notes = [fallback];
                persistSelection(fallback.id);
                forceEditorSync = true;
            } else if (selectedId === noteId) {
                persistSelection(notes[0].id);
                forceEditorSync = true;
            }

            saveNotes(notes);
            openMenuId = '';
            render();

            if (isMobile()) {
                closeSidebar();
            }
        };

        const togglePinned = (noteId) => {
            const index = notes.findIndex((item) => item.id === noteId);
            if (index < 0) {
                return;
            }

            notes[index] = {
                ...notes[index],
                pinned: !notes[index].pinned,
                updatedAt: new Date().toISOString()
            };

            saveNotes(notes);
            openMenuId = '';
            render();
        };

        noteList.addEventListener('click', (event) => {
            const selectTarget = event.target.closest('[data-select-note]');
            const menuTarget = event.target.closest('[data-toggle-menu]');
            const pinTarget = event.target.closest('[data-pin-note]');
            const deleteTarget = event.target.closest('[data-delete-note]');

            if (menuTarget) {
                event.preventDefault();
                event.stopPropagation();
                const noteId = menuTarget.dataset.toggleMenu;
                openMenuId = openMenuId === noteId ? '' : noteId;
                render();
                return;
            }

            if (pinTarget) {
                event.preventDefault();
                event.stopPropagation();
                togglePinned(pinTarget.dataset.pinNote);
                return;
            }

            if (deleteTarget) {
                event.preventDefault();
                event.stopPropagation();
                deleteNote(deleteTarget.dataset.deleteNote);
                return;
            }

            if (selectTarget) {
                selectNote(selectTarget.dataset.selectNote);
            }
        });

        newNoteBtn.addEventListener('click', createNote);
        titleInput.addEventListener('input', saveCurrentNote);
        labelsInput.addEventListener('input', saveCurrentNote);
        contentInput.addEventListener('input', saveCurrentNote);
        duplicateBtn.addEventListener('click', duplicateCurrentNote);
        desktopDuplicateBtn.addEventListener('click', duplicateCurrentNote);
        deleteBtn.addEventListener('click', () => deleteNote(selectedId));

        searchInput.addEventListener('input', () => {
            searchTerm = searchInput.value.trim();
            openMenuId = '';
            render();
        });

        openSidebarBtn.addEventListener('click', openSidebar);
        closeSidebarBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.sidebar-note') && !event.target.closest('.note-actions-menu')) {
                if (openMenuId) {
                    openMenuId = '';
                    render();
                }
            }
        });

        window.addEventListener('resize', () => {
            if (!isMobile()) {
                closeSidebar();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeMenu();
                closeSidebar();
            }
        });

        /* Theme handling */
        const applyTheme = (theme) => {
            if (theme === 'dark') {
                document.body.classList.add('dark');
                if (themeToggleBtn) themeToggleBtn.textContent = '☀️';
            } else {
                document.body.classList.remove('dark');
                if (themeToggleBtn) themeToggleBtn.textContent = '🌙';
            }
        };

        const initTheme = () => {
            try {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved === 'dark' || saved === 'light') {
                    applyTheme(saved);
                    return;
                }

                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    applyTheme('dark');
                    return;
                }

                applyTheme('light');
            } catch (e) {
                applyTheme('light');
            }
        };

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const next = document.body.classList.contains('dark') ? 'light' : 'dark';
                applyTheme(next);
                try { localStorage.setItem(THEME_KEY, next); } catch {}
            });
        }

        // Initialize theme first so render() computes label/card colors correctly
        initTheme();
        render();
        const initialNote = getSelectedNote();
        if (initialNote) {
            syncEditor(initialNote);
        }
    </script>
</body>
</html>
